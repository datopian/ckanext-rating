{% asset "rating/rating-css" %}

{% ckan_extends %}

{% block heading_title %}
<a href="{{ h.url_for('%s.read' % package.type, id=package.name) }}" title="{{ title }}">
  {{title|truncate(80)}}
</a>
    {% set rating = h.package_rating(None, {'package_id' : package.id} ).rating|float %}
    {% if rating != 0 %}
        <div class="dataset-rating">
          <span>{{rating|round(1)}}</span>
          <i class="user-rating-star icon icon-star"></i>
        </div>
    {% endif%}
{% endblock %}
